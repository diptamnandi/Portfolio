<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Plate -->
  <rect width="100" height="100" rx="22" fill="#050505" />
  
  <!-- Outer Cyber Hexagon with Accent Border -->
  <polygon points="50,14 84,33 84,67 50,86 16,67 16,33" fill="#0D0D0D" stroke="url(#cyberCyan)" stroke-width="4.5" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Core Monogram "DN" in JetBrains / Space Grotesk Style -->
  <text x="50" y="58" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="-1">
    D<tspan fill="#22d3ee">N</tspan>
  </text>
  
  <!-- Corner Tech Accent Point -->
  <circle cx="50" cy="14" r="3" fill="#22d3ee" />
</svg>