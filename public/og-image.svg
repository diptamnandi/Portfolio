<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#090d10" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Cyber Grid -->
  <g stroke="rgba(34, 211, 238, 0.08)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Ambient Central Halo -->
  <circle cx="600" cy="270" r="240" fill="rgba(34, 211, 238, 0.07)" filter="url(#cyanGlow)" />

  <!-- Hexagon Core Motif -->
  <polygon points="600,160 670,200 670,280 600,320 530,280 530,200" fill="none" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#cyanGlow)" />
  <circle cx="600" cy="240" r="6" fill="#22d3ee" />

  <!-- Brand Typography -->
  <text x="600" y="380" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    DIPTAM NANDI
  </text>

  <text x="600" y="425" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="20" fill="#22d3ee" text-anchor="middle" letter-spacing="4">
    SOFTWARE ENGINEER • B.TECH CSE
  </text>

  <text x="600" y="475" font-family="'JetBrains Mono', monospace" font-size="16" fill="#a3a3a3" text-anchor="middle">
    Full-Stack Web • Distributed Backends • Interactive 3D • AI/ML Systems
  </text>

  <!-- Tech Tags Footer Bar -->
  <g transform="translate(600, 530)">
    <rect x="-310" y="-18" width="620" height="36" rx="18" fill="#0D0D0D" stroke="rgba(255,255,255,0.1)" />
    <text x="0" y="5" font-family="'JetBrains Mono', monospace" font-size="13" fill="#22d3ee" text-anchor="middle">
      React • Node.js • Three.js • C++ • DSA • Tailwind CSS • WebSockets
    </text>
  </g>
</svg>
